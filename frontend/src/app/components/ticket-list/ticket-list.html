<table>
  <thead>
    <tr>
      <th>Titre</th>
      <th>Statut</th>
      <th>Date de création</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody>
    @for (t of tickets(); track t.id) {
      <tr>
        <td>{{ t.titre }}</td>
        <td><span [ngClass]="badgeClass(t.statut)">{{ t.statut }}</span></td>
        <td>{{ t.dateCreation | date:'dd/MM/yyyy HH:mm' }}</td>
        <td>
          @if (t.statut === 'OUVERT' || t.statut === 'EN_COURS') {
            <button (click)="demanderFermeture(t)">Fermer</button>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
